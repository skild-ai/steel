example = "spin_roll"
source = "steel-webgpu tools/scenes.py spin_roll() @ ad03e49"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode.
args = []

[gallery]
short = "The gold balls stop spinning and rolling; the grey ones keep going."
title = "Spinning and rolling friction"
