[steel]
status = "works"
# 1 substep x 4 iterations: the gold spinner stops in 8 frames and the gold roller in 85 frames after 0.56 m,
# as the coefficients give (0.13 s, 1.43 s, 0.57 m) and as 16 x 50 does; the grey balls match 16 x 50 too.
# The browser's 4 x 12 gives the same motion at 5x the cost. No joints, so joint limits stay off.
sim = { fps = 60, substeps = 1 }
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "propagation_colored" }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

