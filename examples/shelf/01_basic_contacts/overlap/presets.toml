example = "overlap"
source = "steel-webgpu tools/scenes.py overlap() @ ad03e49"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode: 600 frames, 10 s, the columns at rest; the example's check() asserts the outcome.
args = ["--num-frames", "600"]

[gallery]
short = "20 boxes start deep inside each other and separate gently."
title = "Overlapping boxes"
frame = 90

