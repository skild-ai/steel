[steel]
status = "works"
# The browser's 4 x 12 overflowed the propagation rows (the 0.1 m contact gap gives the 20 boxes ~1000 rows
# against 544) and dropped ~450 rows every step: a column fell over. contact_gap_gate 0.01 keeps only contacts
# within 1 cm (~300 rows) and fits.
# 3 substeps x 8 iterations: the boxes separate at 0.73 m/s in the first frame and every column stands (drift
# 1.4 mm, 5 mm/s jitter at rest). The push-out speed grows with the substep count (16 x 50 throws the boxes,
# 1 x 8 is gentler but the columns slide apart after 6 s); 3 x 6 stood here but drifted 27 mm with a 2 cm gate.
# No joints: limits off.
sim = { fps = 60, substeps = 3 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored", velocity_iterations = 4, contact_gap_gate = 0.01 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

