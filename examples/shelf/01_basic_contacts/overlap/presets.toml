[steel_off]
kind = "steel"
status = "works"
# the browser's "Velocity cleanup pass" toggle off: velocity_iterations = 0, the rest as [steel]; the push-out
# launches the top boxes (1.7 m/s, 7 cm up) and topples a column
sim = { fps = 60, substeps = 3 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored", velocity_iterations = 0, contact_gap_gate = 0.01 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"
