[steel]
status = "works"
# The magnets' MJCF `adhesion` imports as steel:adhesion and their `gap` as the attraction band. A small
# rigid gap keeps the other shapes' contacts from reaching the magnets, which would pull on them too.
sim = { fps = 60, substeps = 8 }
model = { rigid_gap = 0.005 }
solver = { iterations = 16, enable_joint_limits = true, articulation_constraint_max = 256 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

