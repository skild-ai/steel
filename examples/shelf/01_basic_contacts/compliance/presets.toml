[steel]
status = "works"
# contact_compliance: each contact's stiffness and damping come from the two shapes' ke and kd (filled by the
# example; Newton's pipeline fills them only for hydroelastic contacts). Compliance needs point friction and no restitution.
# 1 substep x 8 iterations: the blocks settle 9.81, 0.982 and 0.099 mm deep (m g / k exactly), as 16 x 50 does;
# 1 x 4 leaves the stiff block 8% short. The soft block's landing dips 48 mm (16 x 50: 51 mm); the stiff block's
# 20 ms bounce is not resolved at 60 Hz (peak 1.3 mm vs 2.6 mm), invisible at this scale. No joints: limits off.
sim = { fps = 60, substeps = 1 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored", contact_compliance = true, enable_restitution = false, friction_anchor_beta = 0.0 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

