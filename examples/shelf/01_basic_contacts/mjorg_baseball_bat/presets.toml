example = "mjorg_baseball_bat"
source = "google-deepmind/mujoco model/speculative/flipper.xml (MuJoCo 4.0 tour on mujoco.org)"
license = "Apache-2.0"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode.
args = ["--num-frames", "300"]

[gallery]
short = "A spring plunger pitches a ball and a thin spring-loaded bat hits it back."
title = "Baseball bat (mujoco.org)"
frame = 30

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# MuJoCo's 10 ms step. A zero authored gap matches MuJoCo's zero margin: without the velocity-sized
# speculative gap the ball passes through the bat, as it does in MuJoCo 3.17.
sim = { fps = 100, substeps = 1 }
model = { rigid_gap = 0.0 }
collision = { speculative_contact_gap_max = 0.5 }
solver = { solve_mode = "colored", iterations = 12, articulated_contact_response = "propagation", enable_joint_limits = true }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

