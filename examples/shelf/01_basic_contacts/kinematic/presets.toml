[steel]
status = "works"
# 3 substeps x 8 iterations: the paddle (now turned through its joint coordinates, see common/steel_scenes.py)
# sweeps the boxes at its tip speed (boxes peak at 0.51 m/s, as at 16 x 50), none lifts, and boxes pinned between
# paddle and box stay within 1 mm of contact (peak 0.98 mm; 4 x 12: 0.26). 2 x 8 and 4 x 6 reach 1.8 and 1.3 mm,
# 1 substep 4 to 33 mm. No joints: limits off.
sim = { fps = 60, substeps = 3 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored" }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

