example = "mjorg_luggage_carousel"
source = "google-deepmind/mujoco model/surfacevel/carousel.xml (MuJoCo 4.0 tour on mujoco.org)"
license = "Apache-2.0"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode.
args = ["--num-frames", "2400"]

[gallery]
short = "Three conveyor belts feed six bags onto a spinning baggage-claim carousel."
title = "Luggage carousel (mujoco.org)"
frame = 300

