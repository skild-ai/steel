status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# MuJoCo 4.0's surfacevel becomes Steel's mesh surface velocity (see example.py). At the default 10 cm gap
# a bag jams at a belt transfer in about one run in six; at 2 cm none did.
sim = { fps = 60, substeps = 4 }
model = { rigid_gap = 0.02 }
solver = { solve_mode = "colored", iterations = 12, articulated_contact_response = "propagation", free_body_constraint_max = 4096, propagation_constraint_max = 4096 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

