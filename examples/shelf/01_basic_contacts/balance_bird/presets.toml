example = "balance_bird"
source = "newton/examples/contacts/example_balance_bird.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A procedural toy bird balances on a narrow pedestal."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 2048, nconmax = 1024, cone = "elliptic" }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "unstable"
sim = { fps = 60, substeps = 50 }
solver = { angular_damping = 0.0 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"
note = "check failed: ValueError: Test \"balance bird remains upright on the pedestal\" failed for the following bodies: [balance_bird]"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 4 iterations, immediate response: the fastest setting that rocks the bird like XPBD
# (lowest up-axis cosine 0.969 vs 0.972, 2 mm drift) without penetration. One substep freezes it on
# the tip; more iterations change nothing; the colored response costs 45% more on one free body.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "immediate" }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { use_collision_detector = true }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
