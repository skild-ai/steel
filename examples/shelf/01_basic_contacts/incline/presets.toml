[steel]
status = "works"
# 2 substeps x 8 iterations with contact warm start: nothing creeps over 20 s, as at 16 x 50 and 8 x 24. The
# browser's 4 x 12 without warm start lets the stacks creep 0.3 to 1 mm/s (the top box 10 mm in 10 s), and so do
# 4 x 24, 6 x 16 and 8 x 12. Warm start at 2 x 6 also holds; 2 x 4 slides the top box 41 mm, so 2 x 8 for margin.
# contact_gap_gate 0.02: contacts more than 2 cm apart get no rows (141 -> 50 rows), same result, 20% faster.
# No joints: limits off.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored", contact_regularization = 0.0, contact_warmstart = true, contact_gap_gate = 0.02 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

