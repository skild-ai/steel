[steel_off]
kind = "steel"
status = "works"
# the browser's "Friction anchors" toggle off: friction_anchor_beta = 0.0, the rest as [steel]. With warm start the
# stacks hold without anchors too; without warm start at 2 x 8 they slide (the top box 0.48 m in 20 s).
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "propagation_colored", contact_regularization = 0.0, contact_warmstart = true, contact_gap_gate = 0.02, friction_anchor_beta = 0.0 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"
