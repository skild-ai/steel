example = "newton_cradle"
source = "newton/examples/contacts/example_newton_cradle.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A five-ball Newton's cradle on revolute pendulums."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10, enable_restitution = true }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10 }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 2048, nconmax = 1024, cone = "elliptic" }
model = { default_shape_cfg = { mu = 2.0e-5 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "works"
sim = { fps = 60, substeps = 20 }
solver = { angular_damping = 0.0 }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 8 substeps x 16 iterations, immediate response: the fastest setting with XPBD's penetration (0.002 mm
# peak); fewer substeps or iterations let the balls sink millimetres into each other at impact. The
# colored response serializes the five balls of one articulation and costs 3x. The balls keep their
# swing better than XPBD's (first ball still reaches 44.7 degrees after 5 s, XPBD 8.6).
sim = { fps = 60, substeps = 8 }
# contact_friction_gap_max = -inf: the balls are frictionless (mu = 0 as in the other solvers), so no
# contact needs friction rows
solver = { solve_mode = "matrix_free", iterations = 16, articulated_contact_response = "immediate", contact_friction_gap_max = -inf }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { use_collision_detector = true }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
