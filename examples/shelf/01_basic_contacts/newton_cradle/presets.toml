example = "newton_cradle"
source = "newton/examples/contacts/example_newton_cradle.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A five-ball Newton's cradle: one ball swings in, one swings out."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10, enable_restitution = true }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[vbd]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { iterations = 10 }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 2048, nconmax = 1024, cone = "elliptic" }
model = { default_shape_cfg = { mu = 2.0e-5 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[featherstone]
status = "works"
sim = { fps = 60, substeps = 20 }
solver = { angular_damping = 0.0 }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 16 substeps keep one substep of travel (2.5 mm at 2.4 m/s) under half the 5 mm clearance, so impacts
# stay one pair at a time with up to four balls lifted; 12 drift into touching pairs within 10 s with three.
# Each impact is a single contact row, so 4 iterations resolve it.
sim = { fps = 60, substeps = 16 }
# contact_friction_gap_max = -inf: the balls are frictionless (mu = 0 as in the other solvers), so no
# contact needs friction rows. enable_joint_friction applies the hinges' Coulomb friction.
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "immediate", contact_friction_gap_max = -inf, enable_joint_friction = true }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[kamino]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { use_collision_detector = true }
model = { default_shape_cfg = { mu = 0.0 } }
checked = "2026-11-13, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
