example = "ik_cube_stacking"
source = "newton/examples/ik/example_ik_cube_stacking.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--world-count", "16", "--num-frames", "2000"]

[gallery]
short = "Cube stacking in many worlds with inverse kinematics."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { solver = "newton", integrator = "implicitfast", iterations = 20, ls_iterations = 100, nconmax = 1000, njmax = 2000, cone = "elliptic", impratio = 1000.0, use_mujoco_contacts = false }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 3 substeps x 5 iterations: fastest setting with peak and mean penetration below MuJoCo's (0.95 / 0.13 vs
# 1.16 / 0.17 mm) that stacks every cube (16 of 16 worlds); arm tracking of the IK target is 7% looser (0.025 vs
# 0.024 rad RMS). 2 substeps track 39% looser. propagation_constraint_max: the gripper and cubes need up to 673
# rows per world; the default 544 dropped rows in every world. propagation_colored beats immediate here (6.3 vs
# 9.8 ms at 4 substeps x 4 iterations with 768 rows). Patch friction: point friction overflows 768 rows.
# Joint limits off: the IK targets keep the arm inside its range.
sim = { fps = 60, substeps = 3 }
solver = { solve_mode = "matrix_free", iterations = 5, articulated_contact_response = "propagation_colored", propagation_constraint_max = 768, enable_joint_limits = false }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

