example = "robot_panda_hydro"
source = "newton/examples/robot/example_robot_panda_hydro.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "720"]

[gallery]
short = "A Franka Panda picks and places with hydroelastic contacts and inverse kinematics."
frame = 300

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { use_mujoco_contacts = false, disable_sensors = true, solver = "newton", integrator = "implicitfast", cone = "elliptic", njmax = 500, nconmax = 500, iterations = 15, ls_iterations = 100, impratio = 1000.0 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 10 substeps x 16 iterations: the cheapest setting that places the object in the cup on every GPU
# tried, with MuJoCo's penetration (peak 0.09 vs 0.20 mm, mean 0.022 vs 0.018). 12 or fewer iterations,
# or 6 or fewer substeps, drop the object; 8 substeps (40 ms) drops it on an RTX 3090. Hard rows, the
# immediate response, a smaller articulation_constraint_max (rows peak near 280), a larger response
# cache and longest-first coloring are no faster. Still about 5x MuJoCo's frame time.
# enable_joint_limits: the URDF's arm and finger limits; with them the peak penetration falls from
# 0.49 to 0.09 mm at the same cost.
sim = { fps = 60, substeps = 10 }
# Experimental: hydroelastic contacts as implicit compliant rows with point friction.
solver = { solve_mode = "matrix_free", contact_compliance = true, friction_anchor_beta = 0.0, enable_restitution = false, iterations = 16, enable_joint_limits = true, articulation_constraint_max = 1536, free_body_constraint_max = 1024, articulated_contact_response = "propagation_colored" }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

