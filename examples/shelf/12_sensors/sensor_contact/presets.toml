example = "sensor_contact"
source = "newton/examples/sensors/example_sensor_contact.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "160"]

[gallery]
short = "Contact forces from a SensorContact, with per-counterpart breakdowns."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
# One solver step per frame; the example has no substep loop.
sim = { fps = 120 }
solver = { njmax = 100, nconmax = 100, cone = "pyramidal", impratio = 1 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { fps = 120 }
# 2 iterations, immediate response, point friction: fastest setting, and the only one tried that beats MuJoCo's
# frame time; peak and mean penetration (9.6 / 0.37 mm) stay below MuJoCo's (29.8 / 0.59 mm). Patch friction
# (friction_anchor_beta default) costs 19% more for the same contact. The scene needs at most 11 contact rows
# per world, within the default articulation_constraint_max of 32. No joints with limits.
solver = { solve_mode = "matrix_free", iterations = 2, articulated_contact_response = "immediate", friction_anchor_beta = 0.0 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
# One solver step per frame; the example has no substep loop.
sim = { fps = 120 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, use_collision_detector = true, integrator = "moreau", dvi = { max_alternating_iterations = 8, use_schur_complement = true } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
