[steel]
status = "works"
# loop-closing joints need the "immediate" response (this Newton's Steel enforces BALL and REVOLUTE closures only there).
# 2 substeps x 48 iterations: the fastest setting (coreweave sweep, 2026-11-07, mean 1.13 ms per frame) within
# 0.5 mm of the exact reference on both jaws (0.33 mm) and a 0.25 mm loop gap (0.14 mm). Four revolute loops in a
# chain through the slider converge slowly: 2 x 32 leaves the jaws 0.78 mm off, 4 x 16 0.65 mm. Tuned with solve_mode
# "split", which newton f6fc82a8b removed (it runs "serial"); re-checked there at 1.12 ms.
sim = { fps = 50, substeps = 2 }
solver = { solve_mode = "serial", iterations = 48, articulated_contact_response = "immediate" }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

