example = "kamino_basic_dr_testmech"
source = "newton/examples/kamino/example_kamino_basic_dr_testmech.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "120"]

[gallery]
short = "The DR TestMech in many worlds on Kamino."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { fps = 50, substeps = 20 }
# loop-closing joints need the "immediate" response; the four loop closures need 38 constraint rows, over the
# default 32. 20 substeps x 4 iterations: the fastest setting (RTX PRO 6000 sweep, 2026-11-04) whose loop-closure gap
# stays under Kamino's (max 0.36 mm vs 0.47 mm); 10 or 15 substeps open the gaps to 0.6-1.7 mm. Joint limits are
# enforced as in Kamino; joint_limit_activation_gap = 0.1 rad adds a limit row only near its limit, which cuts a
# quarter of the step time and leaves the motion unchanged.
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 64 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
# substeps = frame_dt / sim_dt with sim_dt = 0.001 s
sim = { fps = 50, substeps = 20 }
solver = { use_collision_detector = false, use_fk_solver = false, padmm = { max_iterations = 200, primal_tolerance = 1e-6, dual_tolerance = 1e-6, compl_tolerance = 1e-6, rho_0 = 0.01 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
