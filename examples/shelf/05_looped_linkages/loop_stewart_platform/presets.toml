[steel]
status = "works"
# loop-closing joints need the "immediate" response (this Newton's Steel enforces BALL and REVOLUTE closures only there).
# 1 substep x 28 iterations: the fastest setting (RTX PRO 6000 sweep, 2026-11-07, mean 0.36 ms per frame) within
# 0.5 mm of the exact reference on the platform (0.20 mm) and a 0.25 mm loop gap (0.12 mm). At 1 x 20 the platform is
# 0.53 mm off; 2 x 16 is as accurate as 1 x 32 but 0.60 ms. Tuned with solve_mode "split", which newton f6fc82a8b
# removed (it runs "serial"); re-checked there at 0.36 ms.
sim = { fps = 50, substeps = 1 }
solver = { solve_mode = "serial", iterations = 28, articulated_contact_response = "immediate" }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

