example = "kamino_basic_fourbar"
source = "newton/examples/kamino/example_kamino_basic_fourbar.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "120"]

[gallery]
short = "A four-bar linkage in many worlds on Kamino."

