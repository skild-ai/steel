example = "kamino_basic_heterogeneous"
source = "newton/examples/kamino/example_kamino_basic_heterogeneous.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "120"]

[gallery]
short = "Every basic model in one heterogeneous multi-world Kamino simulation."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { fps = 50, substeps = 4 }
# loop-closing joints need the "immediate" response. 4 substeps x 12 iterations: the fastest setting (coreweave
# sweep, 2026-11-04) whose four-bar loop gap is like Kamino's (0.03 mm vs 0.02 mm); 8 iterations open it to
# 0.08 mm, 3 substeps to 0.07 mm, and 2 overflow the 32 constraint rows on contact. Joint limits are enforced;
# joint_limit_activation_gap = 0.1 rad adds a limit row only near its limit.
solver = { solve_mode = "matrix_free", iterations = 12, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
# substeps = frame_dt / sim_dt with sim_dt = 0.0025 s
sim = { fps = 50, substeps = 8 }
solver = { use_collision_detector = true, use_fk_solver = true, collision_detector = { pipeline = "primitive" }, dynamics = { preconditioning = true }, padmm = { primal_tolerance = 1e-4, dual_tolerance = 1e-4, compl_tolerance = 1e-4, max_iterations = 200, rho_0 = 0.1, use_acceleration = true, warmstart_mode = "containers", contact_warmstart_method = "geom_pair_net_force" } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
