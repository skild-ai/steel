[mujoco]
status = "works"
# The 91 loop hinges are CONNECT equality pairs, +-hinge_half_span along each axis (add_loop_closures_mujoco):
# SolverMuJoCo makes the same pairs from loop joints, but at MuJoCo's default solimp (0.9-0.95) they leak: the
# loops open by 2 mm at 4 substeps. "euler", not the default "implicitfast": the implicit integrators fold the
# drive's kd into the mass matrix after the constraint solve, so the loops are no longer satisfied (they open by
# centimetres).
# Explicit Euler integrates the drive's damping with first-order error, and the drive's time constant (kd/ke = 25 ms)
# is close to the 20 ms frame, so the substep count is set by the drive, not the loops. Scored against
# ground_truth.py over 1000 frames (RTX PRO 6000, 2026-11-07), solref = 2 dt: 1 substep (1.18 ms) puts the driven angle
# 1.43 deg off the exact one (past the 1 deg check); 2 substeps: 0.71 deg, shape within 0.67 mm, 2.33 ms mean per
# frame, the fastest passing setting. 4: 0.37 deg, 4.8 ms; 8: 0.20 deg, 9.4 ms; 16: 0.12 deg, 18.6 ms. The loops close
# to 0.004 mm at 2 substeps. solimp 0.9999 at 1 substep goes non-finite after 200 frames; 0.99-0.999 opens the loops
# by 3 mm at 1 substep. Newton's solve converges in one iteration (equality rows only), so iterations and
# ls_iterations do not change the time.
sim = { fps = 50, substeps = 2 }
solver = { integrator = "euler", iterations = 100, ls_iterations = 50, disable_contacts = true }
model = { hinge_half_span = 0.05, eq_solref = [0.02, 1.0], eq_solimp = [0.999, 0.9999, 0.001, 0.5, 2.0] }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"
[mujoco_all]
kind = "mujoco"
status = "works"
# --drive all: 30 PD drives, and "euler" integrates their kd explicitly on bars of ~2e-6 kg m^2, so the substep
# count is set by that damping, not by the loops. RTX PRO 6000 sweep, 2026-11-07: 36 substeps, mean 46.7 ms per frame;
# over 1000 frames the worst joint gap is 0.0006 mm, hub radius 0.0006 mm, drive error 1.8 deg, momentum 9e-6.
# There is a cliff below it: at 34 substeps or fewer the sphere goes unstable as it opens (gaps of 0.1-100 mm,
# momentum 0.07 and up); 35 passes 500 frames but its momentum starts to grow (1.3e-4 against 9e-6). solimp
# 0.99-0.999 and solref 0.005-0.01 s are all equal here; 0.9999 goes non-finite after 200 frames.
check = { args = ["--num-frames", "200", "--drive", "all"] }
sim = { fps = 50, substeps = 36 }
solver = { integrator = "euler", iterations = 100, ls_iterations = 50, disable_contacts = true }
model = { hinge_half_span = 0.05, eq_solref = [0.01, 1.0], eq_solimp = [0.99, 0.999, 0.001, 0.5, 2.0] }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

