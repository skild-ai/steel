example = "crane_wrecking_ball"
source = "newton/examples/robot/example_steel_wrecking_ball.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A UR10 grasps a toy crane and slews its ball into a dry-stacked miniature building."
frame = 720

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { substeps = 4 }
# At 4 substeps and 10 sweeps, both CUDA settings hold the counterweight through the strike
# and bring down all six upper floors.
solver = { solve_mode = "colored", iterations = 10, articulated_contact_response = "propagation" }
checked = "2026-11-25, newton affc7629a, NVIDIA RTX PRO 6000 Blackwell Server Edition"

