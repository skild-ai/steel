[steel]
status = "works"
# MuJoCo's 4.0 sleep flag maps to Steel's island sleeping. The fallen chain needs about 2100 rows; at the
# default row budget the dropped rows stall the wave or launch dominoes.
sim = { fps = 60, substeps = 4 }
model = { rigid_gap = 0.01 }
solver = { solve_mode = "colored", iterations = 12, articulated_contact_response = "propagation", enable_sleeping = true, free_body_constraint_max = 4096, propagation_constraint_max = 4096 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

