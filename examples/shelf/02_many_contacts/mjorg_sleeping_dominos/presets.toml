example = "mjorg_sleeping_dominos"
source = "google-deepmind/mujoco model/sleep/dominos.xml (MuJoCo 4.0 tour on mujoco.org)"
license = "Apache-2.0"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode.
args = ["--num-frames", "900"]

[gallery]
short = "One tilted domino starts a wave through 96 sleeping dominoes; each row wakes as it arrives."
title = "Sleeping dominos (mujoco.org)"
frame = 240

