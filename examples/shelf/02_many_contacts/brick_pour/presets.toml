[steel]
status = "works"
# 4 substeps x 4 iterations: all 18 bricks slide down into the middle chute's bin, as in an 8 x 20 run, with
# 3.8/0.066 mm peak/mean penetration (8 x 20: 1.3/0.008) at 10.5 ms. The port's 3 x 10 also pours them but runs
# 12.7 ms with 9.1/0.21 mm (studs of resting bricks stay wedged 1-2 mm into each other); fewer substeps
# (2 x 4: 7.0 ms, 3 x 3: 9.0 ms) triple the mean. Joint limits on: the arm's path stays inside them anyway.
sim = { fps = 60, substeps = 4 }
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "propagation_colored", enable_joint_velocity_limits = true, enable_joint_limits = true, free_body_constraint_max = 8192, articulation_constraint_max = 1024, propagation_constraint_max = 16384 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

