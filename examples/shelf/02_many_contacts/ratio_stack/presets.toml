[steel]
status = "works"
# Contact insertion order changes the finite-sweep support distribution in this top-heavy stack.
# Sort the same contact stream in both settings. A Baumgarte gain of 0.3 corrects settling error
# at each contact. The original 0.2 gain allowed the bottom box to creep sideways and tip.
sim = { fps = 60, substeps = 8 }
collision = { deterministic = true }
solver = { solve_mode = "serial", iterations = 16, articulated_contact_response = "immediate", enable_joint_limits = true, baumgarte = 0.3 }
checked = "2026-11-25, newton affc7629a, NVIDIA RTX PRO 6000 Blackwell Server Edition"

