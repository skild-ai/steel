example = "card_house"
source = "steel-webgpu tools/scenes.py card_house() @ ad03e49"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode: 300 frames, 5 s, the house settled; the example's check() asserts the outcome.
args = ["--num-frames", "300"]

