[steel]
status = "works"
# Nesterov momentum with warm start keeps the apex pair standing; every colored propagation setting tried
# (4-32 substeps, 16-64 iterations) loses it within 2 s.
sim = { fps = 60, substeps = 8 }
model = { rigid_gap = 0.002 }
solver = { solve_mode = "serial", iterations = 32, articulated_contact_response = "immediate", nesterov_momentum = true, contact_warmstart = true, free_body_constraint_max = 4096 }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

