example = "vbd_rigid_rigid_contact"
source = "newton/examples/vbd/example_vbd_rigid_rigid_contact.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "Rigid bodies of every shape type dropped into a box container."

[xpbd]
status = "untested"

[vbd]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { iterations = 15, rigid_body_contact_buffer_size = 256 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 6 iterations, immediate response: the fastest setting with lower penetration than VBD's
# (peak 1.6 vs 10.1 mm, mean 0.028 vs 0.052) and all six bodies settled in the box; 2 x 3 is 7% faster
# but sinks deeper on average than VBD; the colored sweep is as fast at 4 iterations. Odd substep
# counts lose a substep per frame in this example's captured graph (VBD's 5 included), so keep it even.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 6, articulated_contact_response = "immediate" }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "untested"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
