example = "pyramid_drop"
source = "pyramid_steel.py, the Steel side of a pyramid-drop comparison against MuJoCo 4.0 (skild-ai/newton f6fc82a8)"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode: 4 s, past the release at 1.5 s and the settling.
# The 100 kg ball comes to rest on the apex in unstable balance and rolls off between about 4.3 and 6.8 s,
# as in the standalone script, knocking blocks down the steps; the check ends before that.
args = ["--num-frames", "240"]

[gallery]
short = "Balls of 1, 10, 100 and 1000 kg dropped onto four 285-block pyramids; only the heaviest topples its pyramid."
frame = 150

