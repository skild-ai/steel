[mujoco_implicit_mpm]
status = "works"
# MuJoCo walks the robot; implicit MPM moves the sand around it (one-way coupling).
sim = { fps = 50, substeps = 4 }
entries.mujoco.solver = { ls_iterations = 50, njmax = 50 }
entries.implicit_mpm.solver = { tolerance = 1.0e-6, transfer_scheme = "pic", grid_type = "sparse", strain_basis = "P0", max_iterations = 50, critical_fraction = 0.0, air_drag = 1.0, collider_velocity_mode = "backward" }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[steel_implicit_mpm]
status = "works"
# Steel walks the robot; implicit MPM moves the sand around it (one-way coupling).
sim = { fps = 50, substeps = 4 }
# 4 substeps x 8 iterations, immediate response with 128 rows: the fastest setting (RTX PRO 6000 sweep, 2026-11-04) that
# keeps the walk (4 iterations, or 2-3 substeps, fail the forward-walk test in some runs); ~4% slower than MuJoCo
# (14.1 vs 13.5 ms, MPM's sand step dominates both). propagation_colored is 1-2 ms slower; 64 rows drop contacts.
# Joint limits are enforced as in MuJoCo (they never engage while walking); joint_limit_activation_gap = 0.1 rad
# adds a limit row only near its limit. Over 6 s the robot veers 0.36 m sideways (MuJoCo: 0.03 m) with every Steel
# setting tried (iterations, substeps, response, friction and drive modes), so it is not a tuning value.
entries.steel.solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "immediate", articulation_constraint_max = 128, enable_joint_limits = true, joint_limit_activation_gap = 0.1 }
entries.implicit_mpm.solver = { tolerance = 1.0e-6, transfer_scheme = "pic", grid_type = "sparse", strain_basis = "P0", max_iterations = 50, critical_fraction = 0.0, air_drag = 1.0, collider_velocity_mode = "backward" }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"
