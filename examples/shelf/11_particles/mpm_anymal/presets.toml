example = "mpm_anymal"
source = "newton/examples/mpm/example_mpm_anymal.py @ skild-ai/newton 7565a26b1"
default = "steel_implicit_mpm"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "100"]

[gallery]
short = "ANYmal C with a pretrained policy walks on implicit MPM sand."

