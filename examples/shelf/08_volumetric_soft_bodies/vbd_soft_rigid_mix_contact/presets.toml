example = "vbd_soft_rigid_mix_contact"
source = "newton/examples/vbd/example_vbd_soft_rigid_mix_contact.py @ newton-collab 7565a26b1"
default = "vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A box-shaped cloth bag hung by its top edge, filled with rigid shapes."

[xpbd]
status = "untested"

[vbd]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { iterations = 15, rigid_body_particle_contact_buffer_size = 1024, rigid_body_contact_buffer_size = 512, particle_enable_self_contact = false, particle_topological_contact_filter_threshold = 3 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "unsupported"
reason = "Steel integrates particles explicitly (SolverSemiImplicit's routines): with this cloth's tri_ke = 1e5 on ~1e-6 kg particles the bags diverge at 5, 50 and 200 substeps per frame (measured; 200 already costs ~13x VBD), and a stable step would need ~1e-5 s"

