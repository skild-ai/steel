example = "rigid_soft_contact"
source = "newton/examples/multiphysics/example_rigid_soft_contact.py @ newton-collab 7565a26b1"
default = "steel_xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A rigid sphere collides with a soft FEM beam."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 32 }
solver = { iterations = 10 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "works"
sim = { fps = 60, substeps = 32 }
solver = { iterations = 10, particle_enable_self_contact = false, particle_enable_tile_solve = false, rigid_body_particle_contact_buffer_size = 512 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

