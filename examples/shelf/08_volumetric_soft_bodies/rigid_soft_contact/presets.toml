[mujoco_semi_implicit]
status = "works"
# Coupled presets (originally `--solver coupled --rigid-solver <rigid> --soft-solver <soft>`):
# the sphere runs on the rigid solver, the soft beam on the soft solver, coupled by proxies.
sim = { fps = 60, substeps = 32 }
solver = { coupling_mode = "lagged", proxy_iterations = 1, mass_scale = 1.0 }
entries.mujoco.solver = { use_mujoco_contacts = false, njmax = 64 }
entries.semi_implicit.solver = {}
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

