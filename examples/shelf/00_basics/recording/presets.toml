[steel]
status = "works"
# 4 substeps x 3 iterations, immediate response: fastest setting with peak and mean penetration below MuJoCo's at 10
# substeps (54/0.27 mm vs 77/0.56 mm); 2 substeps raise the peak to 90 mm, and propagation_colored is 7x slower for
# these humanoids. Joint limits on, as MuJoCo enforces them (off: limbs bend 2.9 rad past them); with
# joint_limit_activation_gap a limit row exists only near its limit (14% faster, same result). The default 32
# articulation rows per world overflow (dropped rows, the humanoids fall through the ground), so 128.
sim = { fps = 60, substeps = 4 }
solver = { solve_mode = "matrix_free", iterations = 3, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 128 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

