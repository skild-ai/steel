example = "basic_heightfield"
source = "newton/examples/basic/example_basic_heightfield.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "Objects dropped onto heightfield terrain."

[xpbd]
status = "works"
sim = { fps = 100, substeps = 10 }
solver = { iterations = 10 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 100, substeps = 10 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 3 iterations, immediate response: fastest setting with peak and mean sphere penetration below XPBD's
# at 10 substeps (0.77/0.044 mm vs 1.40/0.064 mm); 1 substep or 2 iterations raise the mean penetration above it.
sim = { fps = 100, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 3, articulated_contact_response = "immediate" }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 100, substeps = 3 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, use_collision_detector = true, integrator = "moreau", dvi = { max_alternating_iterations = 8 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
