example = "selection_materials"
source = "newton/examples/selection/example_selection_materials.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "100"]

[gallery]
short = "Material properties changed at run time through an ArticulationView."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 50, nconmax = 50 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 3 iterations, immediate response: fastest setting with peak and mean penetration below MuJoCo's at 10
# substeps (6.6/0.72 mm vs 16.0/0.97 mm); 2 iterations raise the mean to 1.22 mm, and propagation_colored is slower
# and penetrates more at every setting. Joint limits on, as MuJoCo enforces them (off: the ant legs bend 1.1 rad past
# them); joint_limit_activation_gap allocates a limit row only near its limit (8% faster, same result). The ants'
# contacts overflow the default 32 articulation rows per world (rows are dropped and the ants sink), so 128.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 3, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 128 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 60, substeps = 8 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 8 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
