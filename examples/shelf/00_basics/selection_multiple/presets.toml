example = "selection_multiple"
source = "newton/examples/selection/example_selection_multiple.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "100"]

[gallery]
short = "Several articulations per world controlled through one ArticulationView."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 100, nconmax = 70 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

