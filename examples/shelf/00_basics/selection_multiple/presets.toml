status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 8 iterations, immediate response: fastest setting with peak and mean penetration and joint-limit
# overshoot all at or below MuJoCo's at 10 substeps (64/1.9 mm, 0.067 rad vs 81/4.7 mm, 0.069 rad); 6 iterations
# overshoot the limits slightly more (0.081 rad). Joint limits on, as MuJoCo enforces them (off: 3 rad past them);
# joint_limit_activation_gap allocates a limit row only near its limit (22% faster, same result). The default 32
# articulation rows per world overflow (dropped rows, bodies fall through the ground), so 128.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 128 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 60, substeps = 6 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 8 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
