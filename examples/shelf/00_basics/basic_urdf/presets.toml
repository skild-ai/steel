example = "basic_urdf"
source = "newton/examples/basic/example_basic_urdf.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A quadruped articulation loaded from URDF."

[xpbd]
status = "unstable"
sim = { fps = 100, substeps = 10 }
model = { default_joint_cfg = { target_ke = 2000.0, target_kd = 1.0 }, default_shape_cfg = { mu = 1.0 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"
