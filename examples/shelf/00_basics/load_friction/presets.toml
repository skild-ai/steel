[steel]
status = "works"
# 4 substeps x 1 iteration, immediate response: the gold hinge holds its pendulum at the -0.8 rad release (no drift);
# the grey one swings to 3.94 rad and back as in a 16 x 32 run, within 0.016 rad (5 mm at the bob) over 6 s
# (2 substeps: 0.038 rad, 1: 0.081 rad). Iterations change nothing; no joint has limits, so they are off; no contacts,
# so the immediate response (0.50 ms; 2 substeps 0.25 ms). The port's 4 x 12 colored: 1.62 ms.
sim = { fps = 60, substeps = 4 }
solver = { solve_mode = "matrix_free", iterations = 1, articulated_contact_response = "immediate", enable_joint_friction = true, enable_joint_limits = false }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

