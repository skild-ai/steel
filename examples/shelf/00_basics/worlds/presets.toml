[steel]
status = "works"
# 2 substeps x 12 iterations, immediate response (1.15 ms): every world's three-box tower settles 0.8 mm in its first
# second and then stands (no creep over 6 s, penetration peak/mean 0.54/0.15 mm); the pendulums stay within 0.055 rad
# (9 mm at the bob) of a 16 x 32 run. Fewer iterations leave the stacks rocking: 1 x 4 topples them, 2 x 4 leaves
# them 5 mm off; contact warm start makes them jitter more. 2 x 16 settles 0.6 mm (1.34 ms). The pendulums have no
# limits, so they are off; the immediate response is faster than propagation_colored at the same counts (4 x 8:
# 1.95 vs 2.57 ms). The port's 4 x 12 colored with limits: 3.51 ms.
# The pendulums never reach their towers: the builder hangs a 0.2 m pendulum 0.2 m from the tower, 0.5 m up.
sim = { fps = 60, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 12, articulated_contact_response = "immediate", enable_joint_limits = false }
checked = "2026-11-10, newton f6fc82a8b, NVIDIA RTX PRO 6000 Blackwell Server Edition"

