example = "sleeping"
source = "newton/examples/mujoco/example_mujoco_sleeping.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--stack-count", "2", "--num-frames", "300"]

[gallery]
short = "Four stacks of ants topple into each other; sleeping islands turn grey."
frame = 240

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 5 }
solver = { enable_sleeping = true, sleep_tolerance = 0.05, iterations = 10, ls_iterations = 10, jacobian = "sparse", njmax = 4096, nconmax = 2048, update_data_interval = 0 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

