example = "selection_articulations"
source = "newton/examples/selection/example_selection_articulations.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "100"]

[gallery]
short = "Batch control of many articulated robots through an ArticulationView."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 60, substeps = 10 }
solver = { njmax = 200, nconmax = 50 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 4 substeps x 6 iterations, immediate response: fastest setting with peak and mean penetration below MuJoCo's at 10
# substeps (173/3.8 mm vs 194/5.0 mm); 4 iterations or 2 substeps penetrate more than MuJoCo. propagation_colored is
# 3-5x slower here (the humanoid's multi-DOF joints take the generic tree kernels) and penetrates more. Joint limits on,
# as MuJoCo enforces them; joint_limit_activation_gap allocates a limit row only near its limit (20% faster, same
# result). The default 32 articulation rows per world overflow (dropped rows, bodies fall through the ground), so 128.
# Each drop (at the start and at every reset) lands the humanoid on the ant: for a few frames the ant's ankles pass their
# limits by up to ~0.35 rad and its feet sink up to ~18 cm into the ground. MuJoCo (0.43 rad) and Kamino (1.2 rad) do too.
sim = { fps = 60, substeps = 4 }
solver = { solve_mode = "matrix_free", iterations = 6, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 128 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 60, substeps = 6 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 7, inequality_sweeps_per_iteration = 1 }, constraints = { gamma = 0.1 } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
