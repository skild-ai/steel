example = "tendon_wrap_switch"
source = "newton/examples/tendon/example_tendon_mujoco_switch.py @ skild-ai/newton 7565a26b1"
default = "xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "210"]

[gallery]
short = "Active-set tendon routing with one optional wrap candidate."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 8 }
solver = { iterations = 12, joint_linear_relaxation = 0.9 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "unsupported"
reason = "Steel has no tendons; the example reads XPBD's tendon state"

[kamino]
status = "untested"

[implicit_mpm]
status = "untested"

