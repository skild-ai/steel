example = "tendon_capstan_friction"
source = "newton/examples/tendon/example_tendon_capstan_friction.py @ newton-collab 7565a26b1"
default = "xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "45"]

[gallery]
short = "Three Atwood machines with different capstan friction on the pulley."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 32 }
solver = { iterations = 32, joint_linear_relaxation = 0.55, rigid_contact_relaxation = 0.25 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

