example = "sensor_camera"
source = "newton/examples/sensors/example_sensor_camera.py @ skild-ai/newton 7565a26b1"
default = "none"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "144"]

[gallery]
short = "A SensorCamera's output shown in the viewer."

# This example builds no physics solver; `none` is its only preset.
