example = "mujoco_franka_vbd_cable_admm_solver"
source = "newton/examples/multiphysics/example_mujoco_franka_vbd_cable_admm_solver.py @ skild-ai/newton 7565a26b1"
default = "steel_xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
# original: --substeps 1 --admm-iterations 1 --xpbd-iterations 2 (now presets, set below)
args = ["--num-frames", "2", "--world-count", "1", "--payload-segments", "3", "--no-graph-capture", "--set", "sim.substeps=1", "--set", "solver.iterations=1", "--set", "entries.xpbd.solver.iterations=2"]

[gallery]
short = "A Franka picks and places a short rigid chain tied to a VBD cable."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

