example = "franka_shirt_fold_stack"
source = "newton/examples/multiphysics/example_franka_shirt_fold_stack.py @ newton-collab 7565a26b1"
default = "steel_vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "600"]

[gallery]
short = "A Franka folds and stacks a T-shirt with two-way cloth coupling."
frame = 300

