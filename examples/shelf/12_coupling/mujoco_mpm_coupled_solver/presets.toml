status = "untested"

[style3d]
status = "untested"

[mujoco_implicit_mpm]
status = "works"
# One coupled step per frame; the rigid entry substeps inside it.
sim = { fps = 100 }
solver = { coupling_mode = "lagged", proxy_iterations = 1, mass_scale = 1.0 }
entries.mujoco.sim = { substeps = 4 }
entries.mujoco.solver = { use_mujoco_contacts = false, njmax = 100 }
entries.implicit_mpm.solver = { grid_type = "fixed", max_active_cell_count = 32768, strain_basis = "P0", max_iterations = 50, critical_fraction = 0.0 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[kamino_implicit_mpm]
status = "works"
# One coupled step per frame; the rigid entry substeps inside it.
sim = { fps = 100 }
solver = { coupling_mode = "lagged", proxy_iterations = 1, mass_scale = 1.0 }
entries.kamino.sim = { substeps = 4 }
entries.kamino.solver = { use_collision_detector = false, use_fk_solver = false, dynamics = { preconditioning = true }, padmm = { max_iterations = 120, primal_tolerance = 1.0e-5, dual_tolerance = 1.0e-5, compl_tolerance = 1.0e-5, rho_0 = 0.1, use_acceleration = true, warmstart_mode = "containers" } }
entries.implicit_mpm.solver = { grid_type = "fixed", max_active_cell_count = 32768, strain_basis = "P0", max_iterations = 50, critical_fraction = 0.0 }
check = { args = ["--num-frames", "2", "--set", "entries.kamino.sim.substeps=1", "--set", "solver.proxy_iterations=1"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[steel_implicit_mpm]
status = "works"
# One coupled step per frame; the rigid entry substeps inside it.
sim = { fps = 100 }
solver = { coupling_mode = "lagged", proxy_iterations = 1, mass_scale = 1.0 }
# 2 rigid substeps x 4 Steel iterations: fastest setting that keeps the boxes stacked on the bed (21.2 ms/frame vs
# MuJoCo's 22.0, the sand solve dominates); box penetration 15.2 / 1.18 mm peak / mean vs MuJoCo's 52.2 / 2.11, sand
# 56.0 / 7.13 mm vs 94.7 / 7.84. 1 substep lets a box sink below the test's sand line by frame 300.
entries.steel.sim = { substeps = 2 }
entries.steel.solver = { solve_mode = "matrix_free", iterations = 4 }
entries.implicit_mpm.solver = { grid_type = "fixed", max_active_cell_count = 32768, strain_basis = "P0", max_iterations = 50, critical_fraction = 0.0 }
check = { args = ["--num-frames", "2", "--set", "entries.steel.sim.substeps=1", "--set", "solver.proxy_iterations=1"] }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"
