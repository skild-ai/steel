example = "mujoco_mpm_coupled_solver"
source = "newton/examples/multiphysics/example_mujoco_mpm_coupled_solver.py @ newton-collab 7565a26b1"
default = "steel_implicit_mpm"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "2", "--set", "entries.mujoco.sim.substeps=1", "--set", "solver.proxy_iterations=1"]  # original: --rigid-substeps 1 --proxy-iterations 1

[gallery]
short = "Rigid boxes fall into a granular MPM bed."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

