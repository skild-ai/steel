example = "mpm_twoway_coupling"
source = "newton/examples/mpm/example_mpm_twoway_coupling.py @ skild-ai/newton 7565a26b1"
default = "steel_implicit_mpm"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "80"]

[gallery]
short = "A dozen rigid shapes dropped onto MPM material with two-way coupling."

