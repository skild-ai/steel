example = "mujoco_xpbd_coupled_solver"
source = "newton/examples/multiphysics/example_mujoco_xpbd_coupled_solver.py @ skild-ai/newton 7565a26b1"
default = "steel_xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "2", "--set", "solver.proxy_iterations=1"]  # original: --proxy-iterations 1

[gallery]
short = "Rigid boxes and a pendulum chain meet an XPBD cloth sheet."

[xpbd]
status = "works"
sim = { fps = 60, substeps = 16 }
solver = { iterations = 40 }
check = { args = ["--num-frames", "2"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd]
status = "untested"

[mujoco]
status = "untested"

