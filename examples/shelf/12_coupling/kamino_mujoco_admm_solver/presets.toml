example = "kamino_mujoco_admm_solver"
source = "newton/examples/multiphysics/example_kamino_mujoco_admm_solver.py @ skild-ai/newton 7565a26b1"
default = "kamino_steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "30", "--world-count", "4"]

[gallery]
short = "A four-bar linkage split between Kamino and MuJoCo or Steel."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

