example = "mujoco_vbd_admm_solver"
source = "newton/examples/multiphysics/example_mujoco_vbd_admm_solver.py @ skild-ai/newton 7565a26b1"
default = "steel_vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "30"]

