example = "franka_cloth_block"
source = "newton/examples/multiphysics/example_franka_cloth_block.py @ newton-collab 7565a26b1"
default = "steel_vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A rigid block rests on a VBD cloth hammock a Franka handles."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

