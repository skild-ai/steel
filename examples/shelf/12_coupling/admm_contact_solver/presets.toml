example = "admm_contact_solver"
source = "newton/examples/multiphysics/example_admm_contact_solver.py @ newton-collab 7565a26b1"
default = "steel_xpbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "120"]

[gallery]
short = "An XPBD particle pad falls into a ball-jointed rigid drawer."

[xpbd]
status = "untested"

