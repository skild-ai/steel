[semi_implicit_xpbd]
status = "works"
# semi_implicit owns the ball-jointed tray; two XPBD particle owners. Set solver.admm_contacts = false for the uncoupled baseline.
sim = { fps = 60, substeps = 2 }
solver = { admm_contacts = true, iterations = 12, rho = 45.0, gamma = 0.001, baumgarte = 0.1 }
entries.semi_implicit.solver = { enable_tri_contact = false, joint_attach_ke = 2.5e4, joint_attach_kd = 4.0e2 }
entries.xpbd.solver = { iterations = 6 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco_xpbd]
status = "works"
# mujoco owns the ball-jointed tray; two XPBD particle owners. Set solver.admm_contacts = false for the uncoupled baseline.
sim = { fps = 60, substeps = 2 }
solver = { admm_contacts = true, iterations = 12, rho = 45.0, gamma = 0.001, baumgarte = 0.1 }
entries.mujoco.solver = { use_mujoco_contacts = false, disable_contacts = true }
entries.xpbd.solver = { iterations = 6 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[steel_xpbd]
status = "works"
# steel owns the ball-jointed tray; two XPBD particle owners. Set solver.admm_contacts = false for the uncoupled baseline.
# With a reduced-coordinate tray (Steel or MuJoCo alike) the semi-implicit preset's coupling (2 substeps x 12 ADMM
# iterations, baumgarte 0.1) lets the pad sink 18.4 mm into the tray (mean 0.85 mm; semi-implicit: 0.77 / 0.12).
# 4 substeps x 8 ADMM iterations x ADMM baumgarte 1.0 is the closest setting found: 1.39 / 0.095 mm peak / mean,
# at 15.6 ms/frame vs semi-implicit's 9.2. Cheaper settings keep a higher mean or peak: 2 x 12 x 1.0 gives
# 1.37 / 0.31 mm at 11.2 ms, 2 x 8 x 1.0 gives 4.4 / 0.32 mm at 7.7 ms; 1 substep loses the contact entirely.
sim = { fps = 60, substeps = 4 }
solver = { admm_contacts = true, iterations = 8, rho = 45.0, gamma = 0.001, baumgarte = 1.0 }
# The tray has no Steel constraint rows (its contacts are ADMM's, the ball joint has no limits), so Steel's own
# iterations do not change the result (1 and 12 measure the same) and split mode costs the same.
entries.steel.solver = { solve_mode = "matrix_free" }
entries.xpbd.solver = { iterations = 6 }
# The tray tips over late in a long run under every preset: its centre of mass is 21 mm above the unlimited ball
# joint, so upright is unstable (time constant about 0.5 s) and small perturbations grow. Here, under
# semi_implicit_xpbd and under mujoco_xpbd alike, it passes 5 degrees at 9.3-11.7 s and is upside down by 11-13 s,
# after the check's 2 s.
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"
