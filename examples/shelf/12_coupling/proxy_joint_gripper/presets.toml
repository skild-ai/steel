example = "proxy_joint_gripper"
source = "newton/examples/multiphysics/example_proxy_joint_gripper.py @ newton-collab 7565a26b1"
default = "steel_vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "120"]

[gallery]
short = "A palm and two cube fingers grip a VBD soft grid."

