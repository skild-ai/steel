example = "boxes_chain_cloth_soft"
source = "newton/examples/multiphysics/example_mujoco_vbd_coupled_solver.py @ skild-ai/newton 7565a26b1"
default = "steel_vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "2", "--set", "solver.proxy_iterations=1"]  # original: --proxy-iterations 1

[gallery]
short = "Rigid boxes and a pendulum chain meet a cloth sheet and soft bodies."

[xpbd]
status = "untested"

[vbd]
status = "works"
sim = { fps = 60, substeps = 8 }
solver = { iterations = 10, friction_epsilon = 0.01, particle_enable_self_contact = true, particle_self_contact_margin = 0.01, particle_self_contact_gap = 0.0 }
check = { args = ["--num-frames", "2"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[mujoco]
status = "untested"

