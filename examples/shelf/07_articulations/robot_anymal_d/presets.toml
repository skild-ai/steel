example = "robot_anymal_d"
source = "newton/examples/robot/example_robot_anymal_d.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "500"]

[gallery]
short = "ANYmal D in many worlds on MuJoCo or Kamino."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 50, substeps = 4 }
solver = { cone = "elliptic", impratio = 100, iterations = 100, ls_iterations = 50, nconmax = 45, njmax = 100 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 1 substep x 4 iterations, immediate response: fastest setting that settles with lower peak and mean penetration
# than MuJoCo (2 iterations sinks 10 mm and fails the test). The propagation responses need 2 substeps x 8
# iterations for the same and run 3.6x slower. articulation_constraint_max: the immediate response keeps contact
# rows per world in this family; the robot uses up to 43 (32 drops rows). Joint limits off: the standing robot
# never reaches them (identical result with them on, 18% slower).
sim = { fps = 50, substeps = 1 }
solver = { solve_mode = "matrix_free", iterations = 4, articulated_contact_response = "immediate", articulation_constraint_max = 128, enable_joint_limits = false }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 50, substeps = 4 }
# use_schur_complement: eliminate bilateral rows once before the projected inequality sweeps.
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 32, use_schur_complement = true, bilateral_solver_type = "LLTBRCM" } }
# Newton test_examples.py tests the Kamino variant with these arguments.
check = { args = ["--num-frames", "500", "--world-count", "1"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
