example = "robot_h1"
source = "newton/examples/robot/example_robot_h1.py @ skild-ai/newton 7565a26b1"
default = "mujoco"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "500"]

[gallery]
short = "A Unitree H1 humanoid from USD."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 50, substeps = 4 }
# joint_target_ke/kd: PD gains of the revolute joints.
model = { joint_target_ke = 150, joint_target_kd = 5 }
solver = { iterations = 100, ls_iterations = 50, njmax = 100, nconmax = 210 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "unstable"
note = "the settle check (all body velocities < 5e-3 at frame 500) passes in about 80% of runs at 1 substep x 8 iterations (13 of 16 on an RTX 3090) and in 0 of 10-15 runs at 6, 10, 12 or 16 iterations, 2 substeps, propagation_colored or velocity_iterations 1-2: the fallen robot rests with jitter right at the limit"
sim = { fps = 50, substeps = 1 }
# joint_target_ke/kd: PD gains of the revolute joints.
model = { joint_target_ke = 150, joint_target_kd = 5 }
# 1 substep x 8 iterations, immediate response, point friction: fastest setting that comes to rest as the test
# requires, with far lower penetration than MuJoCo (peak/mean 1.2/0.03 vs 32/0.8 mm). With patch friction the
# fallen robot keeps creeping and fails the settle check at every count tried (up to 4 substeps x 4 iterations);
# propagation_colored settles from 2 substeps x 8 iterations (1.5 ms, peak 41 mm). articulation_constraint_max: rows
# per world peak at 159 while the robot lies on the ground. enable_joint_limits with joint_limit_activation_gap
# 0.1 rad: a fallen robot can reach its limits, which MuJoCo enforces; rows only near a limit cost nothing here.
solver = { solve_mode = "matrix_free", iterations = 8, articulated_contact_response = "immediate", articulation_constraint_max = 256, enable_joint_limits = true, joint_limit_activation_gap = 0.1, friction_anchor_beta = 0.0 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 50, substeps = 4 }
# joint_target_ke/kd: PD gains of the revolute joints.
model = { joint_target_ke = 500, joint_target_kd = 10 }
# dynamics.cull_speculative_contacts = false preserves ground support as nearly touching contacts cross zero separation.
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dynamics = { cull_speculative_contacts = false }, dvi = { max_alternating_iterations = 8, bilateral_solve_interval = 8, bilateral_solver_type = "LLTBRCM", omega = 1.2, contact_warmstart_method = "key_and_position_with_net_force_backup_and_tangential_net_force", use_schur_complement = true } }
# Newton test_examples.py tests the Kamino variant with these arguments.
check = { args = ["--num-frames", "500", "--world-count", "4"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

