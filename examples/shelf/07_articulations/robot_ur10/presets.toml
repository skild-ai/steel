example = "robot_ur10"
source = "newton/examples/robot/example_robot_ur10.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "500"]

[gallery]
short = "A UR10 arm from USD under a joint-space controller."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 50, substeps = 10 }
solver = { disable_contacts = true }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps, immediate response: fastest setting; the arms track their sweeping targets as closely as with
# MuJoCo's 10 substeps (RMS error 0.102 vs 0.101 rad) and stay within 0.02 rad of MuJoCo's path after the
# first-target transient. Contacts are off, so the only rows are joint limits; the targets stay inside the limits,
# which never engage (identical result with them on, 22% slower). The substep count must stay even: the
# captured graph swaps state_0 and state_1 every substep.
sim = { fps = 50, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 1, articulated_contact_response = "immediate", enable_joint_limits = false }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 50, substeps = 10 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 8, bilateral_solve_interval = 8 } }
# Newton test_examples.py tests the Kamino variant with these arguments.
check = { args = ["--num-frames", "100", "--world-count", "2"] }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
