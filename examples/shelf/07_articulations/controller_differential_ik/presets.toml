example = "controller_differential_ik"
source = "newton/examples/controllers/example_controller_differential_ik.py @ skild-ai/newton 7565a26b1"
default = "none"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "100"]

[gallery]
short = "Differential IK on four heterogeneous robots at once."

# This example builds no physics solver (differential IK writes the sim state directly); `none` is its only preset.
[none]
status = "works"
sim = { fps = 60 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

