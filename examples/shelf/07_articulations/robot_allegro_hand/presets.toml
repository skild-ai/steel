example = "robot_allegro_hand"
source = "newton/examples/robot/example_robot_allegro_hand.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "500"]

[gallery]
short = "An Allegro hand articulation from USD."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "works"
sim = { fps = 50, substeps = 8 }
# nconmax: max contacts per world. cone = "pyramidal" preserves the example's solref-inherited
# grasp friction; its purpose is articulation control rather than kf mapping.
solver = { solver = "newton", integrator = "implicitfast", njmax = 200, nconmax = 300, impratio = 20.0, cone = "pyramidal", iterations = 100, ls_iterations = 50, use_mujoco_contacts = false }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
# 2 substeps x 2 iterations, immediate response: fastest setting with peak and mean penetration below MuJoCo's
# (1 substep raises the mean to 0.8 mm). enable_joint_limits: the clamped finger targets reach the joint limits,
# which MuJoCo enforces; with them on, finger tracking matches MuJoCo's. articulation_constraint_max: the immediate
# response keeps contact and limit rows per world in this family; a hand and its cube use up to 102.
sim = { fps = 50, substeps = 2 }
solver = { solve_mode = "matrix_free", iterations = 2, articulated_contact_response = "immediate", articulation_constraint_max = 128, enable_joint_limits = true }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
sim = { fps = 50, substeps = 8 }
solver = { dynamics_solver = "dvi", sparse_dynamics = true, sparse_jacobian = true, dvi = { max_alternating_iterations = 8, bilateral_solve_interval = 8, bilateral_solver_type = "LLTBRCM", omega = 1.2, contact_warmstart_method = "key_and_position_with_net_force_backup_and_tangential_net_force", use_schur_complement = true } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"
# Newton test_examples.py tests the Kamino variant with these arguments.
check = { args = ["--num-frames", "500", "--world-count", "1"] }

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
