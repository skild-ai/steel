example = "steel_pelican_bicycle"
source = "newton/examples/robot/example_steel_pelican_bicycle.py @ skild-ai/newton 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = []

[gallery]
short = "A UR10 works a physical fader that drives a closed-linkage pelican automaton on a bicycle."
frame = 360

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { substeps = 4 }
# The bicycle closes loops with joints, which Steel solves only under the "immediate" response;
# "propagation_colored" raises at construction.
solver = { solve_mode = "serial", iterations = 12, articulated_contact_response = "immediate" }
checked = "2026-11-09, newton c42985a6c, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[kamino]
status = "untested"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
