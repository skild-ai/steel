example = "kamino_robot_anymal_d"
source = "newton/examples/kamino/example_kamino_robot_anymal_d.py @ newton-collab 7565a26b1"
default = "steel"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "500"]

[gallery]
short = "ANYmal D in many worlds on Kamino."

[xpbd]
status = "untested"

[vbd]
status = "untested"

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "works"
sim = { fps = 50, substeps = 5 }
# 5 substeps x 12 iterations, immediate response: the fastest setting (RTX PRO 6000 sweep, 2026-11-04) whose
# penetration is no worse than Kamino's (peak 3.0 mm vs 5.4 mm); 4 substeps reach 8 mm. The self-colliding ragdoll
# needs more than 128 contact rows: at articulation_constraint_max 128 rows are dropped, and the default 32 makes
# immediate (and split) blow up; propagation_colored needs no row budget but is ~30% slower here. Joint limits
# are enforced as in Kamino; joint_limit_activation_gap = 0.1 rad adds a limit row only near its limit.
solver = { solve_mode = "matrix_free", iterations = 12, articulated_contact_response = "immediate", enable_joint_limits = true, joint_limit_activation_gap = 0.1, articulation_constraint_max = 256 }
checked = "2026-11-04, newton 7565a26b1, NVIDIA GeForce RTX 3090"

[kamino]
status = "works"
# substeps = frame_dt / 0.0025 s
sim = { fps = 50, substeps = 8 }
solver = { padmm = { warmstart_mode = "none" } }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
