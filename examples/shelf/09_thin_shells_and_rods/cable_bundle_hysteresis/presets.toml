[steel]
status = "unsupported"
reason = "Steel has no rod (cable) joints: it reuses Featherstone's joint kinematics, which has no motion for JointType.ROD (it prints 'jcalc_motion not implemented for joint type 7'), and builds drive rows, where a rod stores its stretch/bend/twist stiffness, only for prismatic, revolute and D6 joints. A pinned test rod stays rigid under Steel where VBD sags 81 mm"

