example = "vbd_dat_rigid_soft"
source = "newton/examples/multiphysics/example_vbd_dat_rigid_soft.py @ newton-collab 7565a26b1"
default = "vbd"

[check]
# Arguments `python -m shelf check` passes in test mode (from Newton's test_examples.py).
args = ["--num-frames", "300"]

[gallery]
short = "Small bodies on a pinned sheet under a free sheet, in rigid-soft contact."

[xpbd]
status = "untested"

[vbd]
status = "works"
sim = { fps = 60, substeps = 4 }
checked = "2026-10-28, newton 7565a26b1, NVIDIA RTX A6000"

[vbd.solver]
iterations = 8
# rigid DAT penetration-free truncation (the feature under demonstration)
rigid_soft_enable_dat = true
particle_enable_self_contact = true
# cloth-cloth contact (self-contact DAT): interaction distance + detection reach.
# The per-detection motion budget is ~0.5 * relaxation * (margin + gap), so the
# reach must cover the fastest cloth motion per substep.
particle_self_contact_margin = 1.2e-2
particle_self_contact_gap = 4.0e-2
particle_vertex_contact_buffer_size = 64
particle_edge_contact_buffer_size = 128
rigid_body_particle_contact_buffer_size = 4096

[mujoco]
status = "untested"

[featherstone]
status = "untested"

[semi_implicit]
status = "untested"

[feather_pgs]
status = "untested"

[steel]
status = "unsupported"
reason = "the scene demonstrates VBD's penetration-free truncation (DAT) on edge/face soft contacts, which Steel's particle path rejects (NotImplementedError); with per-particle contacts instead, Steel's explicit particle integration diverges at 4, 40 and 160 substeps per frame, as plain SolverSemiImplicit does (measured)"

[kamino]
status = "untested"

[implicit_mpm]
status = "untested"

[style3d]
status = "untested"
