[featherstone_vbd]
status = "works"
# Featherstone drives the robot; VBD steps the cloth against it (cm scale).
sim = { fps = 60, substeps = 10 }
entries.featherstone.solver = {}
# self-contact (cm scale): particle_self_contact_margin, particle_self_contact_gap
entries.vbd.solver = { iterations = 5, integrate_with_external_rigid_solver = true, particle_self_contact_margin = 0.2, particle_self_contact_gap = 0.0, particle_topological_contact_filter_threshold = 1, particle_rest_shape_contact_exclusion_radius = 0.5, particle_enable_self_contact = true, particle_vertex_contact_buffer_size = 16, particle_edge_contact_buffer_size = 20 }
checked = "2026-11-09, newton c42985a6c, NVIDIA RTX PRO 6000 Blackwell Server Edition"

[steel_vbd]
status = "works"
# Steel drives the robot; VBD steps the cloth against it (cm scale).
sim = { fps = 60, substeps = 10 }
# Steel only integrates the prescribed arm velocities (no contacts, no gravity; joint limits stay off, the IK
# targets stay inside them and the arm path matches Featherstone's), so one iteration and one mass-matrix update per frame (update_mass_matrix_interval = substeps, as
# the Featherstone preset does) give the same arm path; the frame time is VBD's (coreweave sweep, 2026-11-04).
# 8 substeps would be faster but change how the cloth folds.
entries.steel.solver = { solve_mode = "matrix_free", iterations = 1, update_mass_matrix_interval = 10, articulated_contact_response = "immediate" }
# self-contact (cm scale): particle_self_contact_margin, particle_self_contact_gap
entries.vbd.solver = { iterations = 5, integrate_with_external_rigid_solver = true, particle_self_contact_margin = 0.2, particle_self_contact_gap = 0.0, particle_topological_contact_filter_threshold = 1, particle_rest_shape_contact_exclusion_radius = 0.5, particle_enable_self_contact = true, particle_vertex_contact_buffer_size = 16, particle_edge_contact_buffer_size = 20 }
checked = "2026-11-09, newton c42985a6c, NVIDIA RTX PRO 6000 Blackwell Server Edition"
