line-length = 100
[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Tutorial zips pair a sweep with its per-world results, equal in length by construction.
ignore = ["B905"]
[lint.isort]
known-third-party = ["newton", "warp"]
known-local-folder = ["replay", "source_hash"]
