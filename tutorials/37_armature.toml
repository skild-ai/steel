# Page text for 37_armature.py. Fields: tutorials/README.md.

id = "armature"
title = "Armature"
about = """\
Three identical pendulums with armature 0, 0.02 and 0.1 kg·m². Armature adds rotor inertia to \
a DOF in joint space, as in a geared motor. It slows the joint's response and is a common way \
to stabilize light links driven by stiff gains."""
look = [
  "Larger armature gives a longer swing period, so the three drift out of phase.",
  "Second scene, a chain of six light capsules: without armature its energy rises by up to 42% in 4 s; with 0.001 kg·m² it stays within 5.4%.",
]
try = [
  "Use armature 1.0.",
  "Add a stiff drive to a very light link with and without armature.",
]
spacing = [0, 1.3, 0]

[param]
name = "armature"
text = "Joint argument [kg·m² or kg]. Added to the joint-space mass matrix diagonal."

[[metric.charts]]
scene = "pendulums"
key = "armature_0"
label = "joint angle"
unit = "°"
multi = ["armature_0", "armature_0.02", "armature_0.1"]

[[metric.charts]]
scene = "chain"
key = "energy_change_pct"
label = "energy change of a light 6-link chain"
unit = "%"

[concept]
name = "Armature"
what = """\
Armature adds inertia directly to a DOF on the mass-matrix diagonal, the reflected inertia of \
a geared motor. It slows the joint's response and improves the conditioning of light links."""
eq = "H̃ = H + diag(armature)"
here = """\
The pendulum period grows from 1.33 s to about 1.65 s at 0.1 kg·m². A light 6-link chain gains \
up to 42% energy in 4 s without armature and stays within 5.4% with 0.001 kg·m²."""

[[concept.consider]]
term = "Cost"
text = "None."

[[concept.consider]]
term = "Stability"
text = """\
While recording, a free-swinging 9-link chain of light capsules without armature reached NaN \
within 3 s at 200 and 240 Hz, and a 6-link chain gained energy; armature 0.001 kg·m² kept both \
stable. Add a small armature to long chains of light links."""

[[concept.consider]]
term = "Accuracy"
text = "Large armature changes the dynamics; use real motor values where known."

[[concept.consider]]
term = "Use it when"
text = "Geared joints, and long chains of light links that otherwise gain energy."
