name: Site
on:
  pull_request:
    paths: ['site/**', 'tutorials/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tutorials/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.14.10 numpy
      - name: Tutorial metadata, order, and recordings that match their scripts
        run: python tutorials/tools/check.py --poses
      - name: Tutorial tools (CPU-only tests)
        run: python -m unittest discover -s tutorials/tools -p 'test_*.py' -v
      - name: Ruff
        run: |
          ruff check tutorials
          ruff check site/scripts
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Pull requests build the same /steel/ site that main deploys to https://skild-ai.github.io/steel/.
      - name: Build into dist-pages and check internal links and anchors
        run: npm run build:pages
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Check that every figure renders and no table is clipped
        run: |
          npx playwright-core install --with-deps chromium
          npm run check-figures:pages
      - name: Check that tutorial replays start from 0 s on every entry
        run: npm run check-replay:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist-pages
  # Needs the repository's Pages source set to "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [tutorials, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
