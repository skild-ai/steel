name: Site
on:
  pull_request:
    paths: ['site/**', 'tutorials/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tutorials/**', 'CHANGELOG.md', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.14.10 numpy
      - name: Tutorial metadata, order, and recordings that match their scripts
        run: python tutorials/tools/check.py --poses
      - name: Ruff
        run: |
          ruff check tutorials
          ruff check site/scripts
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build and check internal links and anchors
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      # Deploy stub for GitHub Pages, off until hosting is decided. To enable: set the repository's Pages
      # source to "GitHub Actions", set STEEL_SITE_BASE (e.g. /steel/) on the build step above, add
      # `pages: write` and `id-token: write` to permissions, and uncomment.
