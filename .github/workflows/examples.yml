name: Examples distribution licenses
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check build numpy
      - run: python -m unittest discover -s tests -p 'test_distribution_licenses.py' -v
      - run: python -m build
      - run: python scripts/check_distribution_licenses.py dist
      - name: Smoke-test source CLI
        run: python -m shelf list
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m shelf list
